systems:
  - name: oracle
    kind: context_window
    params:
      evidence_only: true
      token_budget: 40000
  - name: window
    kind: context_window
    params:
      evidence_only: false
      token_budget: 32000
  - name: file
    kind: file_search
    params:
      max_tool_calls: 8
  - name: mem0
    kind: mem0
    params:
      top_k: 10
      # Mem0 opens a global Qdrant store under ~/.mem0 per instance; two
      # instances in one process collide on its lock, so units run one at a time.
      serial: true
  - name: langmem
    kind: langmem
    params:
      top_k: 10
  - name: cognee
    kind: cognee
    params:
      top_k: 10
      serial: true
  - name: graphiti
    kind: graphiti
    params:
      top_k: 10
      # The engine's own calls are not paced by the harness; one unit at a
      # time keeps them under the account's per-minute cap.
      serial: true
  - name: letta
    kind: letta
    params:
      base_url: http://localhost:8283
