# OpenRouter free models. Zero cost; shared upstream pools rate-limit under load.
provider: openai_compat
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
answer_model: inclusionai/ling-3.0-flash-fin:free
judge_model: inclusionai/ling-3.0-flash-fin:free
openai_compat_model: inclusionai/ling-3.0-flash-fin:free
# Local CPU embeddings for the products; the API has no free embedding model.
embed_model: BAAI/bge-small-en-v1.5
embed_dims: 384
num_ctx: 40960
temperature: 0.0
max_answer_tokens: 512
seeds: [11, 22, 33]
think: false
min_request_interval_seconds: 3.5
