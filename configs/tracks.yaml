# Model tracks: the same questions and the same judge, a different answerer
# (and the same model inside each product). One results file per track.
#
# Probe of 13 free OpenRouter models on 2026-09-07 (7 calls each: 2 small,
# one 4k-token prompt, one tool call, 3 in parallel):
#   ling-3.0-flash-fin / -sante     7/7  0.7s  tools yes
#   cohere/north-mini-code          7/7  0.8s  tools yes
#   nemotron-3-super-120b-a12b      6/7  0.5s  tools yes  (one 429 in the burst)
#   nemotron-3.5-lightning          7/7  71s   tools yes  (too slow)
#   gemma-4-31b / 26b               0/7  upstream pool saturated (429)
#
# Which products a track can carry depends on the model's API features on
# OpenRouter (checked 2026-09-07 with direct calls, see METHODS):
#   ling-3.0-flash-fin      tools yes, response_format none  -> no Cognee, no Graphiti
#   nemotron-3-super-120b   tools, json_object, json_schema, seed -> all systems
#   cohere/north-mini-code  tools yes, json_object works, json_schema unverified
judge_model: inclusionai/ling-3.0-flash-fin:free
tracks:
  - name: ling-3.0-flash-fin
    answer_model: inclusionai/ling-3.0-flash-fin:free
    systems: oracle,window,file,mem0,langmem
# Retired after the pilot of 2026-09-07. Their results stay in results/runs and
# results/tracks; neither is run again.
#   nemotron-3-super-120b (nvidia/nemotron-3-super-120b-a12b:free): the endpoint
#     failed about one call in four and every failure cost retries; dropped.
#   cohere-north-mini-code (cohere/north-mini-code:free): never ran, daily cap.
# The second track, for the products that need schema-constrained output, is
# chosen by scripts/answerer_bakeoff.sh among the remaining free models.
