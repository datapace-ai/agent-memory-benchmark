# Model tracks: the same questions and the same judge, a different answerer
# (and the same model inside each product). One results file per track.
# Gemma first: its free endpoint answers in under a second; Nemotron's takes
# about 30 seconds and rate-limits under concurrency.
judge_model: google/gemma-4-31b-it:free
tracks:
  - name: gemma-4-31b
    answer_model: google/gemma-4-31b-it:free
  - name: nemotron-3.5-lightning
    answer_model: nvidia/nemotron-3.5-lightning:free
