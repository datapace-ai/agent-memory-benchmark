[project]
name = "membench"
version = "0.1.0"
description = "Vendor-neutral benchmark for AI agent memory systems"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vendors = [
  "mem0ai==2.0.20",
  "langmem==0.0.30",
  "langgraph==1.2.11",
  "langchain-ollama==1.1.0",
  "qdrant-client==1.19.0",
  "cognee==1.5.4",
  "graphiti-core[falkordblite,sentence-transformers]==0.30.1",
  "letta-client==1.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
